<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1720" viewBox="0 0 2600 1720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071020"/><stop offset=".56" stop-color="#0d2141"/><stop offset="1" stop-color="#07182d"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#10d4b2"/><stop offset="1" stop-color="#52f1c9"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#3986ff"/><stop offset="1" stop-color="#78c3ff"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ffad48"/><stop offset="1" stop-color="#ffd27c"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#4c89bb" stroke-opacity=".075" stroke-width="1"/></pattern>
    <marker id="mBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#73baff" stroke-width="2.2" stroke-linejoin="round"/></marker>
    <marker id="mGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#46ead0" stroke-width="2.2" stroke-linejoin="round"/></marker>
    <marker id="mOrange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11" fill="none" stroke="#ffbf72" stroke-width="2.2" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,'DejaVu Sans',Arial,sans-serif;fill:#e9f3ff}
      .caps{font-size:22px;font-weight:800;letter-spacing:3px}
      .name{font-size:38px;font-weight:800}
      .desc{font-size:24px;fill:#a8bfd8}
      .small{font-size:21px;fill:#b3c9e0}
      .tiny{font-size:19px;fill:#8faccc}
      .num{font-size:22px;font-weight:900}
      .arrow{fill:none;stroke-linejoin:round;stroke-linecap:round;stroke-width:6}
      .card{fill:#102a49;stroke:#355b81;stroke-width:2.5}
    </style>
  </defs>

  <rect width="2600" height="1720" fill="url(#bg)"/>
  <rect width="2600" height="1720" fill="url(#grid)"/>
  <circle cx="2250" cy="160" r="460" fill="#1561a2" opacity=".10"/>
  <circle cx="100" cy="1510" r="440" fill="#02b8ae" opacity=".065"/>

  <rect x="115" y="64" width="458" height="45" rx="22" fill="#103f4d" stroke="#18c8b5" stroke-opacity=".7"/>
  <text x="141" y="95" class="caps" style="fill:#66f5db;font-size:19px">END-TO-END CLOUD ENGINEERING</text>
  <text x="112" y="174" font-size="66" font-weight="900" letter-spacing="-1">GitOps with Argo CD on Amazon EKS</text>
  <text x="116" y="224" font-size="29" fill="#a6c9ea">Architecture workflow  |  GitHub Actions + Amazon ECR + Argo CD + exactly 2 EKS worker nodes</text>
  <path d="M115 255H2480" stroke="#2a5276" stroke-width="2"/>

  <rect x="118" y="288" width="270" height="43" rx="18" fill="#193d58"/>
  <text x="146" y="318" class="caps" style="fill:#81c6ff;font-size:19px">TRACK A: BUILD / PUSH</text>

  <!-- GitHub source -->
  <rect x="120" y="354" width="500" height="244" rx="26" class="card"/>
  <rect x="120" y="354" width="500" height="8" rx="4" fill="url(#blue)"/>
  <rect x="148" y="378" width="58" height="46" rx="15" fill="#19486e"/>
  <text x="163" y="411" font-size="27" font-weight="900" style="fill:#86d8ff">01</text>
  <text x="222" y="411" class="caps" style="fill:#79bbff;font-size:20px">GITHUB</text>
  <text x="152" y="474" class="name">Application Source</text>
  <text x="154" y="520" class="desc">Flask app · tests · Dockerfile</text>
  <text x="154" y="558" class="small">Commit / pull request → CI trigger</text>

  <!-- GitHub Actions -->
  <rect x="773" y="354" width="500" height="244" rx="26" class="card"/>
  <rect x="773" y="354" width="500" height="8" rx="4" fill="url(#green)"/>
  <rect x="801" y="378" width="58" height="46" rx="15" fill="#145d59"/>
  <text x="816" y="411" class="num" style="fill:#6df4d9">02</text>
  <text x="874" y="411" class="caps" style="fill:#6df4d9;font-size:20px">AUTOMATED CI</text>
  <text x="807" y="474" class="name">GitHub Actions</text>
  <text x="806" y="520" class="desc">Test → Docker build → AWS OIDC</text>
  <text x="807" y="558" class="small">Push image tagged with commit SHA</text>

  <!-- ECR -->
  <rect x="1425" y="354" width="500" height="244" rx="26" class="card"/>
  <rect x="1425" y="354" width="500" height="8" rx="4" fill="url(#orange)"/>
  <rect x="1453" y="378" width="58" height="46" rx="15" fill="#66513c"/>
  <text x="1468" y="411" class="num" style="fill:#ffd68d">03</text>
  <text x="1525" y="411" class="caps" style="fill:#ffca76;font-size:20px">IMAGE REGISTRY</text>
  <text x="1459" y="474" class="name">Amazon ECR</text>
  <text x="1460" y="520" class="desc">Private, immutable Docker images</text>
  <text x="1460" y="558" class="small">Exact image: registry/app:git-sha</text>

  <path d="M637 476H749" class="arrow" stroke="#73baff" marker-end="url(#mBlue)"/>
  <text x="651" y="450" class="tiny" style="fill:#91bfff">push</text>
  <path d="M1290 476H1401" class="arrow" stroke="#46ead0" marker-end="url(#mGreen)"/>
  <text x="1291" y="449" class="tiny" style="fill:#79efdc">publish</text>

  <!-- Git update loops back to desired-state manifest -->
  <path d="M1022 598V703H369V827" class="arrow" stroke="#55d6c7" stroke-dasharray="13 12" marker-end="url(#mGreen)"/>
  <rect x="492" y="664" width="446" height="44" rx="17" fill="#11464b" stroke="#27a798"/>
  <text x="512" y="694" font-size="21" font-weight="700" style="fill:#a2ffee">Update Git manifest to new SHA</text>

  <rect x="116" y="754" width="335" height="43" rx="18" fill="#193d58"/>
  <text x="145" y="784" class="caps" style="fill:#74efdb;font-size:19px">TRACK B: GITOPS / SYNC</text>

  <!-- Git desired state -->
  <rect x="120" y="839" width="500" height="245" rx="26" class="card"/>
  <rect x="120" y="839" width="500" height="8" rx="4" fill="url(#green)"/>
  <rect x="148" y="862" width="58" height="46" rx="15" fill="#145d59"/>
  <text x="163" y="894" class="num" style="fill:#6df4d9">04</text>
  <text x="223" y="894" class="caps" style="fill:#6df4d9;font-size:20px">SOURCE OF TRUTH</text>
  <text x="152" y="958" class="name">GitOps Manifests</text>
  <text x="154" y="1004" class="desc">GitHub: k8s/ · Deployment · Service</text>
  <text x="154" y="1042" class="small">Desired image SHA + 2 replicas</text>

  <!-- Argo CD -->
  <rect x="773" y="839" width="500" height="245" rx="26" class="card"/>
  <rect x="773" y="839" width="500" height="8" rx="4" fill="url(#blue)"/>
  <rect x="801" y="862" width="58" height="46" rx="15" fill="#19486e"/>
  <text x="816" y="894" class="num" style="fill:#8ec8ff">05</text>
  <text x="878" y="894" class="caps" style="fill:#86beff;font-size:20px">GITOPS CONTROLLER</text>
  <text x="807" y="958" class="name">Argo CD</text>
  <text x="806" y="1004" class="desc">Watch Git · diff · sync · self-heal</text>
  <text x="807" y="1042" class="small">Continuous pull-based reconciliation</text>

  <path d="M637 962H749" class="arrow" stroke="#46ead0" marker-end="url(#mGreen)"/>
  <text x="637" y="934" class="tiny" style="fill:#79efdc">watch</text>

  <!-- EKS containing worker nodes -->
  <rect x="1405" y="725" width="1074" height="706" rx="34" fill="#0e2743" stroke="#4381b7" stroke-width="3"/>
  <rect x="1405" y="725" width="1074" height="10" rx="5" fill="url(#blue)"/>
  <rect x="1438" y="759" width="62" height="47" rx="15" fill="#1a507f"/>
  <text x="1455" y="792" class="num" style="fill:#a6d4ff">06</text>
  <text x="1519" y="794" font-size="37" font-weight="900">Amazon EKS · Kubernetes</text>
  <text x="1443" y="840" class="small">Standard EKS cluster  ·  New VPC  ·  Two Availability Zones</text>

  <rect x="1444" y="872" width="995" height="86" rx="17" fill="#164064" stroke="#377ea5" stroke-width="2"/>
  <text x="1474" y="907" font-size="28" font-weight="800">Kubernetes API / scheduler</text>
  <text x="1474" y="939" class="small">Argo CD applies desired state to the EKS API</text>

  <rect x="1444" y="986" width="473" height="237" rx="23" fill="#132e49" stroke="#328e89" stroke-width="2.5"/>
  <rect x="1964" y="986" width="474" height="237" rx="23" fill="#132e49" stroke="#328e89" stroke-width="2.5"/>
  <rect x="1464" y="1005" width="94" height="35" rx="12" fill="#164c4c"/>
  <text x="1480" y="1031" font-size="19" font-weight="800" style="fill:#77ffdd">AZ - A</text>
  <rect x="1984" y="1005" width="94" height="35" rx="12" fill="#164c4c"/>
  <text x="2000" y="1031" font-size="19" font-weight="800" style="fill:#77ffdd">AZ - B</text>
  <text x="1471" y="1093" font-size="30" font-weight="800">Worker Node 1</text>
  <text x="1991" y="1093" font-size="30" font-weight="800">Worker Node 2</text>
  <text x="1471" y="1134" font-size="22" fill="#a3bed7">Private subnet A · EC2</text>
  <text x="1991" y="1134" font-size="22" fill="#a3bed7">Private subnet B · EC2</text>
  <rect x="1471" y="1160" width="404" height="40" rx="12" fill="#145045" stroke="#2edab3"/>
  <text x="1494" y="1188" font-size="22" font-weight="800" style="fill:#a1ffde">Flask app · Pod replica 1</text>
  <rect x="1991" y="1160" width="405" height="40" rx="12" fill="#145045" stroke="#2edab3"/>
  <text x="2013" y="1188" font-size="22" font-weight="800" style="fill:#a1ffde">Flask app · Pod replica 2</text>

  <rect x="1460" y="1255" width="962" height="111" rx="20" fill="#153d57" stroke="#4a96c2" stroke-width="2"/>
  <text x="1494" y="1302" font-size="31" font-weight="800">Kubernetes Service → Healthy Pods</text>
  <text x="1495" y="1339" font-size="22" fill="#aac8e2">ClusterIP targets both Ready replicas; public NLB forwards HTTP/TCP 80</text>

  <path d="M1290 962H1382" class="arrow" stroke="#73baff" marker-end="url(#mBlue)"/>
  <path d="M1675 598V694H1860V706" class="arrow" stroke="#ffbf72" marker-end="url(#mOrange)"/>
  <rect x="1832" y="615" width="290" height="42" rx="16" fill="#54412e" stroke="#d1964d"/>
  <text x="1850" y="644" font-size="20" font-weight="700" style="fill:#ffe5b2">Kubelet pulls image</text>

  <!-- HTTP path -->
  <path d="M1940 1431V1460" class="arrow" stroke="#46ead0" marker-end="url(#mGreen)"/>
  <rect x="1495" y="1491" width="488" height="116" rx="24" class="card"/>
  <rect x="1495" y="1491" width="488" height="7" rx="3" fill="url(#green)"/>
  <text x="1524" y="1542" font-size="31" font-weight="800">Public Network LB</text>
  <text x="1525" y="1580" class="small">Internet-facing · HTTP 80</text>
  <path d="M1998 1548H2100" class="arrow" stroke="#46ead0" marker-end="url(#mGreen)"/>
  <rect x="2119" y="1491" width="357" height="116" rx="24" class="card"/>
  <rect x="2119" y="1491" width="357" height="7" rx="3" fill="url(#blue)"/>
  <text x="2150" y="1541" font-size="29" font-weight="800">Browser / User</text>
  <text x="2151" y="1580" class="small">HTTP 200 + app response</text>

  <rect x="120" y="1167" width="1153" height="261" rx="26" fill="#0d2840" stroke="#3f6685" stroke-width="2"/>
  <text x="152" y="1222" font-size="31" font-weight="850">Key principle: CI and CD are different jobs</text>
  <text x="154" y="1275" font-size="25" fill="#b6d2e9">CI builds, tests and pushes a SHA-tagged image to ECR.</text>
  <text x="154" y="1323" font-size="25" fill="#b6d2e9">Git declares the version and replicas that should run.</text>
  <text x="154" y="1371" font-size="25" fill="#b6d2e9">Argo CD deploys from Git; CI does NOT run kubectl to deploy.</text>

  <path d="M120 1657H2478" stroke="#2d638c" stroke-width="2"/>
  <text x="122" y="1693" font-size="23" fill="#78e8d3" font-weight="800">ONE COMMIT → CI PASSES → ECR IMAGE → GIT IMAGE SHA → ARGO SYNC → 2 READY PODS → PUBLIC HTTP</text>
</svg>
